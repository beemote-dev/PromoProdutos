name: Monitor diário
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: promoprodutos-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validar compilação Go
        run: go test ./...
      - name: Verificar preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MERCADOLIVRE_ACCESS_TOKEN: ${{ secrets.MERCADOLIVRE_ACCESS_TOKEN }}
        run: go run ./cmd/monitor
      - name: Salvar histórico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json docs/history.json docs/products.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a publicar."
            exit 0
          fi
          git commit -m "Atualiza histórico de preços"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Histórico publicado com sucesso."
              exit 0
            fi
            echo "Push concorrente na tentativa $attempt; repetindo..."
            sleep 3
          done
          echo "::error::Falha ao publicar histórico após 5 tentativas."
          exit 1
